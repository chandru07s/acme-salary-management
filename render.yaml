# One-click deploy on Render: connect the repo and apply this blueprint.
services:
  - type: web
    name: acme-salary-management
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AUTO_SEED   # seeds 10,000 employees on first boot (free tier disk is ephemeral)
        value: "1"
