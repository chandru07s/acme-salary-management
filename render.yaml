# One-click deploy on Render: connect the repo and apply this blueprint.
services:
  - type: web
    name: acme-salary-management
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AUTO_SEED            # seeds 10,000 employees on first boot (free tier disk is ephemeral)
        value: "1"
      - key: OPENAI_API_KEY       # paste the value in the Render dashboard; never commit it
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AGENT_MAX_REQUESTS_PER_HOUR
        value: "60"
      - key: SECRET_KEY           # signs login tokens; Render generates a random value
        generateValue: true
      - key: DEMO_PASSWORD        # password for the three demo accounts (hr@, owner@, viewer@acme.test)
        value: demo1234
